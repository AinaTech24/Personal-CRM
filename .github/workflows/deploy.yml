name: Deploy Aina CRM to VPS

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

concurrency:
  group: aina-crm-production
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Only needs the schema file to generate types — no live database
      # required, unlike the VPS's own `npm run build` (which also runs
      # `prisma migrate deploy` against the real MySQL instance).
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    name: Deploy Production
    needs: verify
    runs-on: ubuntu-latest
    # A hung deploy would otherwise sit in the concurrency group and block every
    # later push behind it.
    timeout-minutes: 30

    steps:
      - name: Check deployment secrets
        # An empty or malformed secret makes the ssh action fail after a few
        # seconds with a generic connection error, which says nothing about the
        # real cause. Check them here so the log names the actual problem.
        #
        # Passed as env vars rather than interpolated into the script: the key is
        # a multi-line block and splicing it into shell source would break it.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          if [ -z "$VPS_HOST" ]; then missing="$missing VPS_HOST"; fi
          if [ -z "$VPS_USER" ]; then missing="$missing VPS_USER"; fi
          if [ -z "$VPS_SSH_KEY" ]; then missing="$missing VPS_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "!! Missing repository secret(s):$missing"
            echo "   Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # The classic mistake, and one this repo has hit: pasting the contents
          # of id_ed25519.pub (the public key) instead of id_ed25519 (the private
          # one). The public key is what belongs in the server's authorized_keys.
          case "$VPS_SSH_KEY" in
            ssh-rsa*|ssh-ed25519*|ecdsa-sha2-*)
              echo "!! VPS_SSH_KEY holds a PUBLIC key (it starts with 'ssh-...')."
              echo "   It needs the PRIVATE key — the whole file including the"
              echo "   '-----BEGIN OPENSSH PRIVATE KEY-----' and END lines."
              echo "   The public key goes in ~/.ssh/authorized_keys on the VPS."
              exit 1
              ;;
          esac
          if ! printf '%s' "$VPS_SSH_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "!! VPS_SSH_KEY has no '-----BEGIN ... PRIVATE KEY-----' header."
            echo "   Copy the private key file verbatim, including both marker"
            echo "   lines and the trailing newline."
            exit 1
          fi
          echo "Secrets present; key looks like a private key."

      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1
        env:
          # Optional pin for where the checkout lives; blank means auto-detect.
          DEPLOY_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Only vars named here are forwarded to the remote shell.
          envs: DEPLOY_APP_DIR
          command_timeout: 25m
          script: |
            set -e

            echo "=== Connected as $(whoami) on $(hostname) ==="

            # Non-interactive SSH sessions don't load the login PATH, so node/npm/pm2
            # (esp. via nvm or a global npm prefix) can be missing. Load them explicitly.
            # `|| true` matters: nvm.sh can return non-zero even when it loads
            # fine, and under `set -e` that aborts the whole deploy about ten
            # seconds in with no error printed at all.
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh" || true
              echo "Loaded nvm."
            fi
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin:$HOME/.yarn/bin"

            echo "=== Tool versions ==="
            # Checked one at a time and by name. `command -v node npm pm2` returns 0
            # if *any* of them resolves, so a missing pm2 slipped through the guard
            # and blew up later with a bare "command not found".
            for tool in node npm pm2; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "!! '$tool' is not on PATH for a non-interactive SSH session."
                echo "   PATH=$PATH"
                echo "   Found instead:"
                ls -1 /usr/local/bin "$HOME/.npm-global/bin" 2>/dev/null | sort -u | head -30 || true
                echo "   Fix: install it globally, or add its directory to PATH above."
                exit 1
              fi
              printf '   %-4s %s (%s)\n' "$tool" "$(command -v "$tool")" "$($tool -v 2>&1 | head -1)"
            done

            echo "=== Locating the app ==="
            # This pointed at a hardcoded /var/www/ainacrm that doesn't exist on
            # this server, so every run died here: `cd` to a missing directory
            # aborts instantly under `set -e`, which is why the runs failed after
            # about ten seconds with no useful output.
            # Set the VPS_APP_DIR secret to pin it; otherwise try the usual spots.
            APP_DIR="$DEPLOY_APP_DIR"
            if [ -z "$APP_DIR" ]; then
              for candidate in \
                "$HOME/aina-crm" \
                /home/aina/aina-crm \
                /var/www/ainacrm \
                /var/www/aina-crm \
                "$HOME/ainacrm"; do
                if [ -f "$candidate/package.json" ]; then APP_DIR="$candidate"; break; fi
              done
            fi
            if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/package.json" ]; then
              echo "!! Could not find the app checkout (no package.json)."
              echo "   Looked in: \$HOME/aina-crm, /home/aina/aina-crm,"
              echo "              /var/www/ainacrm, /var/www/aina-crm, \$HOME/ainacrm"
              echo "   HOME=$HOME"
              echo "   Candidate dirs that do exist:"
              ls -d /home/*/aina*crm /var/www/* 2>/dev/null || echo "     (none)"
              echo "   Fix: add a VPS_APP_DIR secret with the full path."
              exit 1
            fi
            echo "Using $APP_DIR"
            cd "$APP_DIR"

            echo "=== Free disk and memory ==="
            # Both have bitten this deploy before: a full disk breaks npm ci, and
            # next build is the peak-memory step on a small VPS.
            df -h "$APP_DIR" | tail -1
            free -h | head -2 || true

            echo "=== Pulling latest code ==="
            git fetch --all --prune
            git pull --ff-only
            echo "Now at: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

            echo "=== Installing dependencies ==="
            npm ci --no-audit --no-fund

            echo "=== Building (prisma generate + migrate deploy + next build) ==="
            npm run build

            echo "=== (Re)starting PM2 process 'aina-crm' ==="
            pm2 restart aina-crm --update-env || pm2 start npm --name aina-crm -- start
            pm2 save

            echo "=== Waiting for the app to come back up ==="
            # pm2 restart returns as soon as the process is spawned, not once
            # Next/Prisma have actually finished booting — without this, a
            # startup crash (or anything else wrong with the new build) would
            # still print "completed successfully" with a dead app behind it.
            ready=false
            for attempt in $(seq 1 30); do
              if curl -sf -o /dev/null "http://127.0.0.1:3000/login"; then
                ready=true
                echo "App responded (attempt $attempt, ~$((attempt * 2))s after restart)."
                break
              fi
              sleep 2
            done

            if [ "$ready" != true ]; then
              echo "=== App did not come back up within 60s after restart — failing this deploy ==="
              pm2 logs aina-crm --lines 100 --nostream || true
              exit 1
            fi

            echo "=== Deployment completed successfully ==="
