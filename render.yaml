services:
  - type: web
    name: aina-crm
    runtime: node
    plan: starter
    region: singapore
    branch: main
    # db push (not migrate) because this project has no migrations directory —
    # schema.prisma is the source of truth. Deliberately no --accept-data-loss:
    # a destructive schema change fails the build instead of dropping columns.
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      # Set these in the Render dashboard (Environment tab) — do not commit real values:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
