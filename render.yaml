services:
  - type: web
    name: aina-crm
    runtime: node
    plan: starter
    region: singapore
    branch: main
    # Prisma generate + db push live in the "build" script rather than here, so
    # they run even when this file isn't what drives the service. render.yaml
    # only applies to Blueprint-linked services; a dashboard-created service
    # ignores it and uses its own build command. Keeping the steps in the npm
    # script means any host that runs `npm run build` gets a synced schema.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      # Set these in the Render dashboard (Environment tab) — do not commit real values:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
